name: Release

# Publish-on-tag only. Checks live in ci.yml.
# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      contents: read
      id-token: write # Trusted Publishing; no API token is stored anywhere

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check the tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' plantranger/__init__.py)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
          echo "Releasing $version"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
